name: Accessibility Audit

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: backend

      - name: Run accessibility audit
        id: audit
        run: |
          node server.js > /tmp/autoa11y-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          node audit-ci.js
        working-directory: backend

      - name: Comment violations on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const reportPath = "backend/audit-report.md";
            if (!fs.existsSync(reportPath)) {
              core.info("No audit report found; skipping PR comment.");
              return;
            }

            const body = fs.readFileSync(reportPath, "utf8");
            const marker = "<!-- autoa11y-audit -->";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing audit comment #${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info("Created new audit comment on the PR.");
            }
